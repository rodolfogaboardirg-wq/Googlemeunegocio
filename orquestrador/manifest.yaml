    max_silence_hours: 26
    error_patterns: ["Erro geral", "Traceback", "ERROR"]
    success_patterns: ["Alerta enviado", "Nenhum vencimento"]

  - name: "Alertas Obrigacoes (Obsidian)"
    task_scheduler_name: "Alertas Obrigacoes GG"
    log_path: "C:/EMAILS AUTOMATICOS/log_alertas_obrigacoes.txt"
    log_format: python_logging
    expected_schedule: "varias vezes ao dia"
    max_silence_hours: 26
    error_patterns: ["Erro geral", "Traceback", "ERROR"]
    success_patterns: ["Alerta enviado", "Nenhuma obrigacao"]

  - name: "Lembrete UNIP"
    task_scheduler_name: "Lembrete UNIP GG"
    log_path: null   # print-based, sem log estruturado
    log_format: null
    expected_schedule: "dia 5 do mes"
    max_silence_hours: 745   # ~31 dias
    error_patterns: []

  - name: "Lembrete Gerar Obrigacoes"
    task_scheduler_name: "Lembrete Gerar Obrigacoes GG"
    log_path: null
