# ---------------------------------------------------------------------------
# AGENTES CLAUDE CODE REATIVOS
# Não são monitorados pelo orquestrador (sem Task Scheduler).
# Documentados aqui para referência do ecossistema completo.
# ---------------------------------------------------------------------------

agents:

  - name: "gg-ads"
    model: opus
    arquivo: "C:/Users/User/.claude/agents/GG-ads.md"
    tipo: reativo
    escopo: "Google Ads + META Ads — criação, monitoramento, criativos"

  - name: "gg-obrigacoes"
    model: opus
    arquivo: "C:/Users/User/.claude/agents/gg-obrigacoes.md"
    tipo: reativo + routine
    escopo: "Obrigações fiscais — DAS, DCTF, EFD-Reinf, vencimentos"
    routine: "trig_01SSwPYjKQ18FUFtMdaoRHip (seg-sex 10h SP)"

  - name: "gg-fiscal"
    model: opus
    arquivo: "C:/Users/User/.claude/agents/gg-fiscal.md"
    tipo: reativo
    escopo: "Tributação, retenções em NF, apuração, CNAE"

  - name: "gg-social-post"
    model: sonnet
    arquivo: "C:/Users/User/.claude/agents/gg-social-post.md"
    tipo: reativo + routine
    escopo: "Publicador Instagram GG via Meta Graph API"
    routine: "trig_01HTUTm6G7GMoTZHQ2zJHsD7 (seg/qua/sex 11h BRT)"

  - name: "gg-vendas-digital"
    model: opus
    arquivo: "C:/Users/User/.claude/agents/gg-vendas-digital.md"
    tipo: reativo
    escopo: "CRO, landing pages, ManyChat, análise de conversão"

  - name: "gg-financeiro"
    model: opus
    arquivo: "C:/Users/User/.claude/agents/gg-financeiro.md"
    tipo: reativo + routine
    escopo: "Financeiro GG + pessoal via API Xfin"
    routine: "CLI mensal dia 10 (Task Scheduler local)"

  - name: "gg-onboarding"
    model: opus
    arquivo: "C:/Users/User/.claude/agents/gg-onboarding.md"
