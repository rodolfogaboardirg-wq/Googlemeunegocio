    planilha: "//GG_SERVIDOR/CLIENTES CONTABILIDADE/OPERACIONAL/ONBOARDING IMPLANTAÇÃO/GG_Clientes_Onboarding.xlsx"

# ---------------------------------------------------------------------------
# WORKFLOWS N8N (Hostinger — https://automacao.ggservicodecontabilidade.com.br)
# Rodam no servidor n8n, fora do Task Scheduler: o script ainda NAO monitora
# esta secao (ele so le "automations"). Documentados aqui para o ecossistema.
# Status/erros: n8n > Executions do workflow; resultado de cada post fica na
# planilha Google "Postagem Google" (colunas status / publicado_em / Post_id / erro).
# ---------------------------------------------------------------------------

workflows_n8n:

  - name: "GMB — Gerar Post Semanal (Claude)"
    n8n_workflow: "GG - Google Meu Negocio - Gerar Post Semanal (Claude)"
    n8n_id: "9jjnvIIy3VvUWNrv"
    expected_schedule: "seg 07:45"
    escopo: "Claude (API Anthropic + pesquisa web) escreve o post semanal do Perfil da Empresa no Google e grava na planilha 'Postagem Google' ja como Aprovado (100% automatico, sem revisao). Falha -> linha com status Erro na planilha."
    criado_em: "2026-11-09"
    substitui: "tarefa agendada Claude trig_01QLupfN4z7N8drVH732EdBK (desativada em 2026-11-09)"

  - name: "GMB — Publicar via Sheets"
    n8n_workflow: "GG - Google Meu Negocio - Publicar via Sheets"
    n8n_id: "m1lCCAJeWua9Ifh2"
    expected_schedule: "seg-sex 10:00 e 16:00"
    escopo: "Le a planilha 'Postagem Google' (status Aprovado), publica 1 post por vez no perfil 'GG Contabilidade' (botao Saiba mais -> home), marca Publicado/Erro na planilha e envia e-mail com o texto publicado para rodolfo@ggservicodecontabilidade.com.br."
    planilha: "https://docs.google.com/spreadsheets/d/16sgnS4uAefuvjIMNyz4KDl6Y9Ocxi128qMGB_YBiJcA"
    criado_em: "2026-11-09"

  - name: "GMB — Post Semanal (webhook, plano B)"
    n8n_workflow: "GG - Google Meu Negocio - Post Semanal"
    n8n_id: "nF43b0kSw3zKw6K2"
    expected_schedule: "sob demanda (POST /webhook/gmb-post com Header Auth)"
    escopo: "Publicacao manual de um post via webhook (campo caption)."
