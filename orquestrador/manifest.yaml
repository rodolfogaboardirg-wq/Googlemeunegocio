# GG Orquestrador — Manifest de Automações
#
# Fonte primária: Windows Task Scheduler (LastRunTime + LastTaskResult)
# Fonte secundária: log_path (opcional, pra extrair detalhes de erro)
#
# task_scheduler_name: nome exato registrado no Windows Task Scheduler
# log_path: caminho do log (opcional — usado só pra enriquecer diagnóstico)
# log_format: "python_logging" (YYYY-MM-DD HH:MM:SS,ms - msg) ou "bracket" ([YYYY-MM-DD HH:MM:SS] [LEVEL] msg) ou null
# expected_schedule: descrição humana da frequência esperada (informativo)
# max_silence_hours: se LastRunTime for mais antigo que isso, alerta SILENT
# error_patterns: regex adicional pra procurar no log (além do LastTaskResult != 0)

automations:

  # --- C:\EMAILS AUTOMATICOS\ (Python legado) ---

  - name: "Xfin Pessoal"
    task_scheduler_name: "Relatorio Xfin GG"
    log_path: "C:/EMAILS AUTOMATICOS/log_xfin.txt"
    log_format: python_logging
    expected_schedule: "diario 07:30"
    max_silence_hours: 26
    error_patterns: ["Erro geral", "Traceback", "ERROR"]
    success_patterns: ["Relatorio enviado"]

  - name: "Xfin GG Servicos"
    task_scheduler_name: "Relatorio Xfin GG Servicos"
    log_path: "C:/EMAILS AUTOMATICOS/log_xfin_gg.txt"
